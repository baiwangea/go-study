Name: user-api
Host: 0.0.0.0
# greet-api 占用 8888，这里改用 8889，两个 API 服务可同时启动
Port: 8889

# 下游 user.rpc 的客户端配置
# Endpoints: 直连模式，本地调试不需要 etcd
# NonBlock : 启动时下游未就绪也不会退出，方便两个服务分别调试
# 生产环境应改为服务发现: Etcd: { Hosts: [127.0.0.1:2379], Key: user.rpc }
UserRpc:
  Endpoints:
    - 127.0.0.1:8080
  NonBlock: true
  Timeout: 3000
